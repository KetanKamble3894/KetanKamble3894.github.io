site_name: Ketan Kamble
site_description: Microsoft Modern Workplace, in the open — Intune, Entra, Graph, and how it actually works underneath the portal.
site_url: https://ketankamble.com/
site_author: Ketan Kamble
copyright: "© 2026 Ketan Kamble · Independent content, built in the open."

edit_uri: ""

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  # Clean, native-feeling humanist sans (like scloud.work's Segoe UI) but a distinct
  # typeface, so the site reads similarly without looking identical.
  font: false   # self-hosted Inter/JetBrains Mono via extra.css — no Google Fonts (privacy + CWV)
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to system preference

hooks:
  - hooks/og_banner.py
  - hooks/tag_feed.py

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/lightbox.js
  - javascripts/post-meta.js
  - javascripts/reveal.js

plugins:
  - search
  - social:
      cards: true
      cards_layout_options:
        background_color: "#0b1120"
        color: "#e9eef7"
        font_family: Inter
  - tags: {}
  - blog:
      blog_dir: blog
      post_readtime: true
      post_url_format: "{slug}"
  - rss:
      match_path: "blog/posts/.*"
      date_from_meta:
        as_creation: date
      categories:
        - categories
        - tags

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid-src
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: docs
      check_paths: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

