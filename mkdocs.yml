  social:
    - icon: fontawesome/brands/linkedin
      name: Ketan Kamble on LinkedIn
      link: https://www.linkedin.com/in/ketan-kamble-012a1582/
    - icon: fontawesome/brands/github
      name: Ketan Kamble on GitHub
      link: https://github.com/KetanKamble3894
  # Analytics: cookieless GoatCounter beacon (no cookies, no consent banner,
  # counts every visitor). Beacon lives in overrides/main.html + overrides/home.html.
