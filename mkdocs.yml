      - Intune Documentation: scripts/intune-documentation.md
      - Policy Assignments: scripts/policy-assignments.md
      - Device Hygiene: scripts/device-hygiene.md
      - App Deployment Failures: scripts/app-deployment-failures.md
      - License Compliance: scripts/license-compliance.md
      - Windows 11 Readiness: scripts/windows11-readiness.md
      - Autopilot Operations: scripts/autopilot-operations.md
      - Local AI Agent Inventory: scripts/local-ai-agent-inventory.md
      - Non-Compliant Devices: scripts/noncompliant-devices.md
      - Synthetic Fleet Generator: scripts/synthetic-fleet.md
  - Power BI:
      - Overview: powerbi/index.md
      - Device Inventory report: powerbi/device-inventory-report.md
      - Inventory — All Devices report: powerbi/inventory-all-devices-report.md
      - Intune Documentation report: powerbi/intune-documentation-report.md
      - Policy Assignments report: powerbi/policy-assignments-report.md
      - Device Hygiene report: powerbi/device-hygiene-report.md
      - App Deployment Failures report: powerbi/app-deployment-failures-report.md
      - License Compliance report: powerbi/license-compliance-report.md
