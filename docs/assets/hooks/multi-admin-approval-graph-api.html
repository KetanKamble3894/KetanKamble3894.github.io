<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>multi-admin-approval-graph-api — hook</title>
<style>
:root{--dur:9s}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#0B1220;overflow:hidden}
.stage{position:relative;width:100%;aspect-ratio:1200/470;background:radial-gradient(120% 90% at 50% -10%,#12203a 0%,#0B1220 60%);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;color:#E5E7EB;border-radius:16px;overflow:hidden}
/* avatar */
.avatar{position:absolute;left:3%;top:42%;transform:translateY(-50%);width:12.5%;aspect-ratio:1;border-radius:50%;border:3px solid #2c3b57;box-shadow:0 6px 18px rgba(0,0,0,.5);overflow:hidden;background:#0f1a2e}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.applbl{position:absolute;left:3%;width:12.5%;top:74%;text-align:center;font-size:clamp(8px,1.05vw,13px);color:#cbd5e1;font-weight:700}
.applbl span{display:block;color:#8aa0bf;font-weight:500;font-size:clamp(7px,.9vw,11px);margin-top:2px}
/* graph node */
.graph{position:absolute;right:3%;top:50%;transform:translateY(-50%);width:16%;text-align:center}
.graph .box{border:1.5px solid #28364F;background:#111A2C;border-radius:12px;padding:9% 4%;font-weight:700;font-size:clamp(9px,1.4vw,17px)}
.graph .sub{color:#8aa0bf;font-weight:500;font-size:clamp(7px,1vw,12px);margin-top:5%}
/* gate: pieces are DIRECT children of stage, each independently centered */
.gateline{position:absolute;left:50%;top:6%;bottom:16%;width:0;border-left:3px dashed #f0b429;opacity:.85;transform:translateX(-50%)}
.gatelbl{position:absolute;left:50%;top:2%;transform:translateX(-50%);white-space:nowrap;color:#f0b429;font-weight:800;letter-spacing:.6px;font-size:clamp(8px,1.2vw,14px)}
.shield{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:clamp(24px,3vw,38px);height:clamp(28px,3.6vw,46px);background:#1a1205;border:2px solid #f0b429;border-radius:7px 7px 12px 12px}
/* lanes + packets */
.lbl-lane{position:absolute;left:19%;font-size:clamp(8px,1.15vw,13px);color:#8aa0bf;font-weight:700}
#getLane{top:31%}#postLane{top:63%}
.pkt{position:absolute;transform:translate(-50%,-50%);padding:1.4% 2.6%;border-radius:20px;font-weight:700;font-size:clamp(8px,1.15vw,14px);white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.get{background:#0f3d2e;color:#34d399;border:1px solid #1f7a5c}
.post{background:#3a2c0a;color:#f0b429;border:1px solid #7a5a12}
#getPkt{top:36%;left:20%;animation:getMove var(--dur) cubic-bezier(.4,0,.5,1) infinite}
@keyframes getMove{0%{left:20%;opacity:0}6%{opacity:1}46%{left:82%;opacity:1}52%{opacity:0}100%{left:82%;opacity:0}}
#getBadge{top:36%;left:82%;opacity:0;background:#0f3d2e;color:#34d399;border:1px solid #1f7a5c;animation:badge var(--dur) linear infinite}
@keyframes badge{0%,44%{opacity:0;transform:translate(-50%,-50%) scale(.7)}50%{opacity:1;transform:translate(-50%,-50%) scale(1)}72%{opacity:1}84%{opacity:0}100%{opacity:0}}
#postPkt{top:68%;left:20%;animation:postMove var(--dur) cubic-bezier(.4,0,.4,1) infinite}
@keyframes postMove{0%{left:20%;opacity:0}6%{opacity:1}40%{left:46%;opacity:1}46%{left:46%}100%{left:46%;opacity:1}}
#postResult{top:68%;left:46%;opacity:0;background:#3a2c0a;color:#f0b429;border:1px solid #7a5a12;animation:postRes var(--dur) linear infinite}
@keyframes postRes{0%,42%{opacity:0}52%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:1}}
#queued{position:absolute;top:80%;left:46%;transform:translate(-50%,-50%);opacity:0;font-size:clamp(7px,.95vw,12px);color:#8aa0bf;font-weight:600;white-space:nowrap;animation:q var(--dur) linear infinite}
@keyframes q{0%,54%{opacity:0}62%{opacity:1}100%{opacity:1}}
.cap{position:absolute;left:50%;bottom:3.5%;transform:translateX(-50%);color:#7f93b3;font-size:clamp(8px,1.05vw,13px);text-align:center;width:92%}
.cap b{color:#cbd5e1}
@media (prefers-reduced-motion:reduce){
  #getPkt,#postPkt,#getBadge,#postResult,#queued{animation:none!important}
  #getPkt{opacity:0}#getBadge{opacity:1;transform:translate(-50%,-50%)}
  #postPkt{left:46%;opacity:1}#postResult{opacity:1;transform:translate(-50%,-50%)}#queued{opacity:1}
}
</style></head>
