<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>windows11-readiness — hook</title><style>
:root{--dur:14s;--ease:cubic-bezier(.22,.61,.36,1)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#0B1220;overflow:hidden}
body{color:#E5E7EB;font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{position:relative;width:100%;line-height:0}
svg.hook{width:100%;height:auto;display:block;border-radius:16px}
.btn{position:absolute;right:10px;bottom:10px;appearance:none;border:1px solid #28364F;
background:rgba(15,27,48,.85);color:#E5E7EB;font:600 12px/1 Inter,sans-serif;padding:7px 11px;
border-radius:8px;cursor:pointer;line-height:1;z-index:2}
.btn:focus-visible{outline:2px solid #0EA5A0;outline-offset:2px}
.an{animation-duration:var(--dur);animation-iteration-count:infinite;animation-timing-function:var(--ease);animation-fill-mode:both}
.fig.paused .an,.fig.paused .spin{animation-play-state:paused}
.spin{animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center}
.spin.f{animation-duration:1.1s}.spin.c{animation-duration:1.4s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes r1{0%{opacity:0}3%{opacity:1}22%{opacity:1}26%{opacity:0}100%{opacity:0}}
@keyframes r2{0%,22%{opacity:0}26%{opacity:1}44%{opacity:1}48%{opacity:0}100%{opacity:0}}
@keyframes r3{0%,44%{opacity:0}48%{opacity:1}68%{opacity:1}72%{opacity:0}100%{opacity:0}}
@keyframes r4{0%,68%{opacity:0}72%{opacity:1}100%{opacity:1}}
@keyframes r4in{0%,74%{opacity:0}76%{opacity:0}80%{opacity:1}100%{opacity:1}}
@keyframes bcap{0%{opacity:0}3%{opacity:1}68%{opacity:1}72%{opacity:0}100%{opacity:0}}
@keyframes acap{0%,68%{opacity:0}72%{opacity:1}100%{opacity:1}}
@keyframes sweep{0%,70%{opacity:0;transform:translateX(0)}73%{opacity:.9}80%{opacity:.9;transform:translateX(792px)}82%,100%{opacity:0}}
@keyframes bigpop{0%,44%{opacity:0;transform:scale(.6)}48%{opacity:1}50%{transform:scale(1.08)}52%{transform:scale(1)}68%{opacity:1;transform:scale(1)}72%{opacity:0}100%{opacity:0}}
.s1{animation-name:r1}.s2{animation-name:r2}.s3{animation-name:r3}.s4{animation-name:r4}.s4in{animation-name:r4in}
.bc{animation-name:bcap}.ac{animation-name:acap}.sw{animation-name:sweep}
.big{animation-name:bigpop;transform-box:fill-box;transform-origin:left center}
/*rest-state*/.s1,.s2,.s3,.sw,.bc{opacity:0}.s4,.s4in,.ac{opacity:1}
@media (prefers-reduced-motion:reduce){.an,.spin{animation:none!important}
.s1,.s2,.s3,.sw,.bc{opacity:0!important}.s4,.s4in,.ac{opacity:1!important}.btn{display:none}}
