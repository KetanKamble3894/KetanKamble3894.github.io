{% if page and page.meta and page.meta.comments %}
<div class="page-actions">
  <!-- ============================================================
       AD / SPONSOR SLOT  (ready to enable)
       When you're approved by an ad network or land a sponsor, paste the
       ad code between the markers below and it appears under every post.
       Example (Google AdSense):
       <ins class="adsbygoogle" style="display:block"
            data-ad-client="ca-pub-XXXXXXXX" data-ad-slot="XXXXXXXX"
            data-ad-format="auto"></ins>
       <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  ============================================================ -->

  <div class="share">
    <span>Share:</span>
    <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ page.canonical_url | urlencode }}" target="_blank" rel="noopener">in · LinkedIn</a>
    <a href="https://twitter.com/intent/tweet?text={{ page.title | urlencode }}&url={{ page.canonical_url | urlencode }}" target="_blank" rel="noopener">𝕏 · Post</a>
    <button type="button" onclick="navigator.clipboard.writeText('{{ page.canonical_url }}');this.textContent='Copied ✓'">Copy link</button>
  </div>

  <p style="margin-top:1rem"><a href="{{ 'blog/' | url }}">← More from the blog</a></p>

  <!--
    COMMENTS (giscus) — free, uses GitHub Discussions.
    To turn on: enable Discussions on your site repo, install the giscus app
    (https://github.com/apps/giscus), then get the 4 values from https://giscus.app
    and replace the PLACEHOLDER_* below. Until then this stays silent (no build error).
  -->
  <script src="https://giscus.app/client.js"
    data-repo="KetanKamble3894/KetanKamble3894.github.io"
    data-repo-id="PLACEHOLDER_REPO_ID"
    data-category="Announcements"
    data-category-id="PLACEHOLDER_CATEGORY_ID"
    data-mapping="pathname"
    data-strict="1"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="top"
    data-theme="preferred_color_scheme"
    data-lang="en"
    crossorigin="anonymous"
    async>
  </script>
</div>
{% endif %}
